[project]
name = "oryn"
version = "0.1.0"
description = "Oryn OS — an operating system for your AI workforce"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.164",
  "uvicorn[standard]>=0.54",
  "temporalio>=1.36",
  "langgraph>=1.2",
  "anthropic>=2.10",
  "mcp>=2.3",
  "sqlalchemy[asyncio]>=2.1",
  "alembic>=1.20",
  "asyncpg>=0.32",
  "psycopg[binary]>=3.3",
  "pgvector>=0.5",
  "redis>=8.1",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "twilio>=9.13",
  "pyjwt>=2.15",
  "argon2-cffi>=25.1",
  "cryptography>=50",
  "sse-starlette>=3.7",
  "structlog>=26.1",
  "httpx>=0.28",
  "aiosmtplib>=4.0",
  "python-multipart>=0.0.20",
  "email-validator>=2.2",
]

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.5",
  "ruff>=0.17",
  "mypy>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oryn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
