<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Oryn OS runs your business's AI agents end to end, and stops to ask a person before anything risky." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Oryn OS</title>
    <script>
      // Apply a saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem("oryn.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
